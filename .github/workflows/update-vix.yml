name: Update README cards

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays at 22:30 UTC, after the US close
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:                       # runs straight away when the scripts or this file change
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the VIX snapshot
        run: python scripts/update_vix.py
        continue-on-error: true
      - name: Build the GitHub stats cards
        run: python scripts/update_stats.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update README cards"
          git push
